# Render Blueprint. In the Render dashboard: New +  ->  Blueprint, point it at
# this repo, then fill in the secret values marked sync:false.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: client-portal
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /
    autoDeploy: true
    # A persistent disk keeps templates_store across restarts and deploys.
    # NOTE: Render's free plan does NOT include persistent disks. If you stay on
    # free, remove this disk block and expect templates to reset on redeploy,
    # or move template storage to a database. On a paid plan, keep it.
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      # Storage lives on the mounted disk so it persists.
      - key: STORE_DIR
        value: /var/data/templates_store
      - key: OUTBOX_DIR
        value: /var/data/outbox
      - key: UPLOADS_TMP_DIR
        value: /var/data/uploads_tmp
      # Production hardening.
      - key: FLASK_DEBUG
        value: "0"
      - key: SESSION_COOKIE_SECURE
        value: "1"
      # Secrets: set these in the dashboard (never commit real values).
      - key: SECRET_KEY
        generateValue: true          # Render generates a strong random value
      - key: ADMIN_PASSWORD_HASH
        sync: false                  # paste output of gen_password_hash.py
      - key: ADMIN_EMAIL
        sync: false
      - key: MAIL_MODE
        value: smtp
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USE_TLS
        value: "1"
      - key: SMTP_USERNAME
        sync: false
      - key: SMTP_PASSWORD
        sync: false                  # Gmail 16-char app password
      - key: LINK_EXPIRY_DAYS
        value: "7"
      # Optional landing-page branding.
      - key: COMPANY_NAME
        value: Meridian
      - key: COMPANY_TAGLINE
        value: Insurance Services
      - key: CONTACT_EMAIL
        sync: false
      - key: CONTACT_PHONE
        sync: false
      - key: CONTACT_ADDRESS
        sync: false
