# Render Blueprint. In the Render dashboard: New +  ->  Blueprint, point it at
# this repo, then fill in the secret values marked sync:false.
# Docs: https://render.com/docs/blueprint-spec
#
# FREE-PLAN NOTE: the free plan has no persistent disk, so questionnaire and
# document templates the admin creates are stored on the instance's ephemeral
# filesystem and RESET on every redeploy or restart (and the service sleeps
# after ~15 min of inactivity, with a slow first request afterwards). That is
# fine for a demo: just recreate the templates after a redeploy. To make
# templates durable, upgrade to a paid plan with a disk (add a `disk:` block and
# point STORE_DIR/OUTBOX_DIR/UPLOADS_TMP_DIR at the mount) or move storage to a
# database.
services:
  - type: web
    name: client-portal
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /
    autoDeploy: true
    envVars:
      # Production hardening.
      - key: FLASK_DEBUG
        value: "0"
      - key: SESSION_COOKIE_SECURE
        value: "1"
      # Secrets: set these in the dashboard (never commit real values).
      - key: SECRET_KEY
        generateValue: true          # Render generates a strong random value
      - key: ADMIN_PASSWORD_HASH
        sync: false                  # paste output of gen_password_hash.py
      - key: ADMIN_EMAIL
        sync: false
      # Email: Resend HTTP API (works on hosts that block SMTP, like Render
      # free). Create a free key at https://resend.com and set RESEND_API_KEY.
      - key: MAIL_MODE
        value: resend
      - key: RESEND_API_KEY
        sync: false                  # Resend API key (re_...)
      - key: MAIL_FROM
        sync: false                  # verified sender, e.g. onboarding@resend.dev
      - key: LINK_EXPIRY_DAYS
        value: "7"
      # Optional landing-page branding.
      - key: COMPANY_NAME
        value: Meridian
      - key: COMPANY_TAGLINE
        value: Insurance Services
      - key: CONTACT_EMAIL
        sync: false
      - key: CONTACT_PHONE
        sync: false
      - key: CONTACT_ADDRESS
        sync: false
