{% extends "base.html" %}
{% block title %}{{ atr.a_signin }}{% endblock %}
{% block appbar_actions %}{% endblock %}
{% block container_class %}container--narrow{% endblock %}
{% block content %}
<div class="card card--pad-lg" style="margin-top:40px">
  <p class="eyebrow">{{ atr.a_administration }}</p>
  <h1>{{ atr.a_signin }}</h1>
  <p class="help">{{ atr.a_signin_intro }}</p>
  <form method="post" action="{{ url_for('login') }}">
    <label>{{ atr.a_password }}
      <input type="password" name="password" autofocus required>
    </label>
    <button type="submit" class="btn btn--block btn--lg" style="margin-top:20px">
      {{ atr.a_login }}</button>
  </form>
</div>
{% endblock %}
